<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchFlow - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .profile-card { border-radius: 15px; border: none; }
        .status-section { background-color: #ffffff; border-radius: 10px; padding: 20px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-intersect me-2"></i>MatchFlow</a>
            <div class="d-flex">
                <button class="btn btn-light btn-sm fw-semibold" id="btnLogout">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card profile-card shadow-sm mb-4">
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <i class="bi bi-person-circle display-1 text-secondary"></i>
                        </div>
                        <h4 id="profileName" class="fw-bold text-dark">Nombre del Candidato</h4>
                        <p id="profileEmail" class="text-muted">correo@ejemplo.com</p>
                        
                        <hr>

                        <div class="status-section mt-3">
                            <h6 class="text-uppercase text-muted small fw-bold mb-3">Mi Estado Laboral</h6>
                            <div class="mb-3">
                                <span id="statusBadge" class="badge p-2 fs-6">Cargando estado...</span>
                            </div>
                            <div class="d-grid">
                                <button id="availabilityBtn" class="btn btn-primary fw-bold">
                                    Actualizar Estado
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card profile-card shadow-sm">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3 small text-uppercase">Mis Habilidades</h6>
                        <div id="skillsContainer">
                            <span class="badge bg-light text-dark border me-1">HTML</span>
                            <span class="badge bg-light text-dark border me-1">JavaScript</span>
                            <span class="badge bg-light text-dark border me-1">Bootstrap</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card profile-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0">
                        <h5 class="mb-0 fw-bold text-primary">
                            <i class="bi bi-briefcase me-2"></i>Ofertas de Empleo Disponibles
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table id="jobsTable" class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Puesto</th>
                                        <th>Descripción</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="4" class="text-center py-4 text-muted">
                                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                            Buscando vacantes...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Lógica simple de cierre de sesión
        document.getElementById('btnLogout')?.addEventListener('click', () => {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="js/pages/index.js"></script>
</body>
</html>
