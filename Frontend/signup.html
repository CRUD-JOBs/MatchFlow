        <link rel="stylesheet" href="/Frontend/css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <!-- Signup Container -->
        <div class="container-fluid vh-100 d-flex justify-content-center align-items-center" id="signupContainer">
            <div class="row w-100">
                <div class="col-md-6 col-lg-5 col-xl-4 mx-auto">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-5">
                            <div class="text-center mb-4"> <!-- Image Logo -->
                                <div class="logo-image bg-primary bg-opacity-50 rounded-circle mx-auto d-flex justify-content-center align-items-center" style="width: 80px; height: 80px;">
                                    <img src="/Frontend/image/logo.jpg" alt="Logo-login" style="width: 10rem;">
                                </div>
                            </div>
                            <!-- Title and Subtitle -->
                            <h2 class="text-center fw-bold mb-2"> Matchflow </h2>
                            <p class="text-center text-muted mb-4"> Create your account </p>
                            <!-- Signup Form -->
                            <form id="signupForm">
                                <div class="mb-3">  <!-- Name -->
                                    <label for="signupFullname" class="form-label fw-semibold"> Name </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0"> <i class="bi bi-person"> </i> </span>
                                        <input type="text" class="form-control border-start-0 ps-0" id="signupFullname" placeholder="Enter your name" required>
                                    </div>
                                </div>
                                <div class="mb-3"> <!-- Email Address -->
                                    <label for="signupEmail" class="form-label fw-semibold"> Email Address </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0"> <i class="bi bi-envelope"> </i> </span>
                                        <input type="email" class="form-control border-start-0 ps-0" id="signupEmail" placeholder="Enter your email address" required>
                                    </div>
                                </div>
                                <div class="mb-3"> <!-- Password -->
                                    <label for="signupPassword" class="form-label fw-semibold"> Password </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0"> <i class="bi bi-lock"> </i> </span>
                                        <input type="password" class="form-control border-start-0 ps-0" id="signupPassword" placeholder="Create your password" required>
                                    </div>
                                </div>
                                <div class="mb-3"> <!-- Confirm Password -->
                                    <label for="signupConfirmPassword" class="form-label fw-semibold"> Confirm Password </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0"> <i class="bi bi-lock-fill"> </i> </span>
                                        <input type="password" class="form-control border-start-0 ps-0" id="signupConfirmPassword" placeholder="Confirm your password" required>
                                    </div>
                                </div>
                                <div class="mb-4"> <!-- Select Role -->
                                    <label for="loginRole" class="form-label fw-semibold"> Select Role </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0"> <i class="bi bi-person-vcard"> </i> </span>
                                        <select class="form-select border-start-0 ps-0" id="loginRole" required>
                                            <option value="select" selected> Select </option>
                                            <option value="candidate"> Candidate </option>
                                            <option value="company"> Company </option>
                                        </select>
                                    </div>
                                </div>
                                <!-- Sign Up Button -->
                                 <button type="submit" class="btn btn-primary w-100 fw-semibold mb-3 "> Sign In </button>
                                <!-- Sign In Link -->
                                <p class="text-center text-muted mb-0"> Already have an account? <a href="/Frontend/login.html" class="text-decoration-none text-primary fw-semibold" id="showLogin"> Sign in </a> </p>
                            </form>
                        </div>
                    </div>
                    <!-- Footer -->
                    <footer class="footer" style="margin-top: 2rem;">
                        <p class="text-center text-muted mb-4"> Match flow copyright </p>
                    </footer>
                </div>
            </div>
        </div>
        <script src="/Frontend/js/pages/signup.js"> </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"> </script>
    </body>
</html>
