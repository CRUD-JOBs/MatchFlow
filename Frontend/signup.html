<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | MatchFlow</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div
      class="container-fluid vh-100 d-flex justify-content-center align-items-center"
      id="signupContainer"
    >
      <div class="row w-100">
        <div class="col-md-6 col-lg-5 col-xl-4 mx-auto">
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
              <div class="text-center mb-4">
                <div
                  class="logo-image bg-primary bg-opacity-50 rounded-circle mx-auto d-flex justify-content-center align-items-center"
                >
                  <img class="rounded-pill" src="./assets/image/logo.jpg" alt="Logo-signup" />
                </div>
              </div>
              <h2 class="text-center fw-bold mb-2">MatchFlow</h2>
              <p class="text-center text-muted mb-4">Create your account</p>
              
              <form id="signupForm">
                <div class="mb-3">
                  <label for="name">Full Name / Company Name</label>
                  <input
                    type="text"
                    id="name"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="email">E-mail</label>
                  <input
                    type="email"
                    id="email"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password">Password</label>
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-4">
                    <label for="role">I am a:</label>
                    <select id="role" class="form-select" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="candidate">Candidate</option>
                        <option value="company">Company</option>
                    </select>
                </div>

                <div class="text-center">
                  <button type="submit" class="btn btn-primary w-100 fw-semibold mb-3">
                    Sign Up
                  </button>
                  
                  <p class="text-center text-muted mb-0">
                    Already have an account? 
                    <a href="./login.html" class="text-decoration-none text-primary fw-semibold" id="showLogin">
                        Sign in
                    </a>
                  </p>
                </div>
              </form>
            </div>
          </div>
          <footer class="footer">
            <p class="text-center text-muted mt-4">Match flow copyright</p>
          </footer>
        </div>
      </div>
    </div>

    <script src="./js/pages/signup.js" type="module"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
