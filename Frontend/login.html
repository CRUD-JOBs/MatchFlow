<!-- Create login for candidate/company validation -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | MatchFlow</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- Login Container -->
    <div
      class="container-fluid vh-100 d-flex justify-content-center align-items-center"
      id="loginContainer"
    >
      <div class="row w-100">
        <div class="col-md-6 col-lg-5 col-xl-4 mx-auto">
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
              <div class="text-center mb-4">
                <!-- Image Logo -->
                <div
                  class="logo-image bg-primary bg-opacity-50 rounded-circle mx-auto d-flex justify-content-center align-items-center"
                >
                  <img class="rounded-pill" src="./assets/image/logo.jpg" alt="Logo-login" />
                </div>
              </div>
              <!-- Title and Subtitle -->
              <h2 class="text-center fw-bold mb-2">MatchFlow</h2>
              <p class="text-center text-muted mb-4">Login to your account</p>
              <!-- Login Form -->
              <form id="loginForm">
                <div class="mb-3">
                  <label for="email">E-mail</label>
                  <input
                    type="email"
                    id="email"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password">Password</label>
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    required
                  />
                </div>
                <div class="text-center">
  <button type="submit" class="btn btn-primary w-100 mb-3">
    Log in
  </button>
  
  <p class="text-black-50 mt-2">Don't have an account?</p>
  
  <a href="./signup.html" class="btn btn-secondary w-100">
    Sign up
  </a>
</div>
              </form>
            </div>
          </div>
          <!-- Footer -->
          <footer class="footer">
            <p class="text-center text-muted mb-4">Match flow copyright</p>
          </footer>
        </div>
      </div>
    </div>
    <script src="./js/pages/login.js" type="module"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
